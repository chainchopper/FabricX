<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fabric — Multi‑Sensory Interactive Platform (Fanalogy)</title>

    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#22d3ee" />
    <meta property="og:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta property="og:description" content="Weave reality together. A game‑like, minimal‑chrome space with synchronized visuals, haptics, and audio. Powered by Nirvana." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta name="twitter:description" content="Weave reality together. Game‑like canvas, synchronized cues, minimal chrome. Powered by Nirvana." />
    <meta name="twitter:image" content="/logo.png" />

    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overscroll-behavior: none;
      }
      body { overflow: hidden; }
      canvas { touch-action: none; }
      /* Hotfix 1.7: a long press in Fabric is a musical / drawing
         gesture (hold a piano key, press the smoke) — never a text
         gesture. Kill the iOS long-press selection callout and text
         selection on the whole app surface, then opt real text
         fields back in so typing/selecting in inputs still works. */
      html, body, #root, #root * {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #root input, #root textarea, #root [contenteditable="true"] {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }
    </style>

    <script>
      (function () {
        // --- Utilities -------------------------------------------------------
        function scrubStr(s) {
          try {
            return String(s).replace(/<anonymous>/g, 'anonymous');
          } catch (_) { return s; }
        }

        function scrubErrorLike(obj) {
          try {
            if (!obj || typeof obj !== 'object') return obj;
            if (typeof obj.message === 'string') obj.message = scrubStr(obj.message);
            if (typeof obj.stack === 'string') obj.stack = scrubStr(obj.stack);
            if (typeof obj.file === 'string') obj.file = scrubStr(obj.file);
            if (typeof obj.fileName === 'string') obj.fileName = scrubStr(obj.fileName);
            if (typeof obj.methodName === 'string') obj.methodName = scrubStr(obj.methodName);
            return obj;
          } catch (_) { return obj; }
        }

        function scrubPayload(payload) {
          try {
            // Typical /symbolicate payload has { stack: Frame[] }
            if (payload && Array.isArray(payload.stack)) {
              payload.stack = payload.stack.map(function (f) {
                if (!f || typeof f !== 'object') return f;
                if (typeof f.file === 'string') f.file = scrubStr(f.file);
                if (typeof f.methodName === 'string') f.methodName = scrubStr(f.methodName);
                if (typeof f.stack === 'string') f.stack = scrubStr(f.stack);
                if (typeof f.message === 'string') f.message = scrubStr(f.message);
                if (typeof f.fileName === 'string') f.fileName = scrubStr(f.fileName);
                return f;
              });
            } else {
              // fallback: try common fields
              scrubErrorLike(payload);
            }
          } catch (_) {}
          return payload;
        }

        async function readBodyAsText(body) {
          try {
            if (typeof body === 'string') return body;
            if (body == null) return null;
            if (body instanceof Blob) return await body.text();
            // Request/ReadableStream: try to build a Request and read it
            if (typeof body === 'object') {
              try {
                if (body.text && typeof body.text === 'function') {
                  return await body.text();
                }
              } catch (_) {}
            }
          } catch (_) {}
          return null;
        }

        function buildInitFromRequest(req, overrideBody) {
          const headers = {};
          try { req.headers && req.headers.forEach && req.headers.forEach((v,k)=>{headers[k]=v}); } catch(_) {}
          return {
            method: req.method || 'POST',
            headers,
            body: overrideBody != null ? overrideBody : undefined,
            mode: req.mode,
            credentials: req.credentials,
            cache: req.cache,
            redirect: req.redirect,
            referrer: req.referrer,
            referrerPolicy: req.referrerPolicy,
            integrity: req.integrity,
            keepalive: req.keepalive
          };
        }

        // --- Console/Error sanitization -------------------------------------
        try {
          var origError = console.error, origWarn = console.warn;
          console.error = function () {
            var args = Array.prototype.map.call(arguments, function (a) {
              if (a instanceof Error) {
                scrubErrorLike(a);
                var msg = (a.name || 'Error') + ': ' + (a.message || '');
                return (a.stack ? scrubStr(msg + '\n' + a.stack) : scrubStr(msg));
              }
              if (typeof a === 'string') return scrubStr(a);
              if (a && typeof a === 'object') return scrubErrorLike(a);
              return a;
            });
            return origError.apply(console, args);
          };
          console.warn = function () {
            var args = Array.prototype.map.call(arguments, function (a) {
              if (typeof a === 'string') return scrubStr(a);
              if (a && typeof a === 'object') return scrubErrorLike(a);
              return a;
            });
            return origWarn.apply(console, args);
          };

          window.addEventListener('error', function (e) {
            try {
              if (e && e.error) scrubErrorLike(e.error);
              if (e && typeof e.message === 'string') e.message = scrubStr(e.message);
              if (e && typeof e.filename === 'string') e.filename = scrubStr(e.filename);
            } catch (_) {}
          });
          window.addEventListener('unhandledrejection', function (e) {
            try {
              if (e && e.reason) scrubErrorLike(e.reason);
            } catch (_) {}
          });
        } catch (_) {}

        // --- Fetch interceptor: sanitize /symbolicate bodies -----------------
        try {
          var _origFetch = window.fetch;
          window.fetch = async function(input, init) {
            try {
              var url = '';
              if (typeof input === 'string') url = input;
              else if (input && typeof input === 'object' && input.url) url = input.url;

              var isSymbolicate = url.indexOf('/symbolicate') !== -1;

              if (!isSymbolicate) {
                return _origFetch(input, init);
              }

              // Determine body
              var bodyText = null;
              if (init && 'body' in init) {
                bodyText = await readBodyAsText(init.body);
              } else if (input && typeof input === 'object' && input.body) {
                // Request object
                try {
                  var cloned = input.clone();
                  bodyText = await cloned.text();
                } catch (_) {}
              }

              if (bodyText) {
                try {
                  var payload = JSON.parse(bodyText);
                  scrubPayload(payload);
                  var newBody = JSON.stringify(payload);

                  if (typeof input === 'string') {
                    var newInit = Object.assign({}, init || {}, { body: newBody });
                    return _origFetch(input, newInit);
                  } else {
                    var reqInit = buildInitFromRequest(input, newBody);
                    return _origFetch(url, reqInit);
                  }
                } catch (_) {
                  // fallthrough on parse errors
                }
              }

              // No readable body or parsing failed: best-effort passthrough
              return _origFetch(input, init);
            } catch (_) {
              return _origFetch(input, init);
            }
          };
        } catch (_) {}

        // --- XHR interceptor: sanitize /symbolicate bodies -------------------
        try {
          var XHR = window.XMLHttpRequest;
          function PatchedXHR() {
            var xhr = new XHR();
            var _url = '';
            var _send = xhr.send;

            xhr.open = function(method, url) {
              _url = url || '';
              return XHR.prototype.open.apply(xhr, arguments);
            };

            xhr.send = function(body) {
              try {
                if (_url && _url.indexOf('/symbolicate') !== -1) {
                  var text = body;
                  // handle FormData/Blob minimalistically
                  if (body && typeof body !== 'string') {
                    // try to stringify if JSON-like
                    try { text = JSON.stringify(body); } catch (_) {}
                  }
                  if (typeof text === 'string') {
                    try {
                      var payload = JSON.parse(text);
                      scrubPayload(payload);
                      body = JSON.stringify(payload);
                    } catch (_) {
                      // non-JSON body; leave as-is
                    }
                  }
                }
              } catch (_) {}
              return _send.call(xhr, body);
            };

            return xhr;
          }
          window.XMLHttpRequest = PatchedXHR;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to run this app.</noscript>
  </body>
</html>
