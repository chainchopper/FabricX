<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fabric — Multi‑Sensory Interactive Platform (Fanalogy)</title>

    <!-- Favicon -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme color (Fanalogy cyan/blue energy) -->
    <meta name="theme-color" content="#22d3ee" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta property="og:description" content="Weave reality together. A game‑like, minimal‑chrome space with synchronized visuals, haptics, and audio. Powered by Nirvana." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta name="twitter:description" content="Weave reality together. Game‑like canvas, synchronized cues, minimal chrome. Powered by Nirvana." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Full-viewport sizing and transparent background so Fabric stays visible -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overscroll-behavior: none;
      }
      /* Make sure nothing adds unexpected scrollbars over the canvas */
      body { overflow: hidden; }

      /* WebGL canvas interaction friendliness */
      canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to run this app.</noscript>
  </body>
</html>
