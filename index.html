    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overscroll-behavior: none;
      }
      body { overflow: hidden; }
      canvas { touch-action: none; }
    </style>

    <script>
      (function () {
        // 1) Sanitize console strings and Error stacks containing "<anonymous>"
        try {
          var origError = console.error, origWarn = console.warn;
          function sanitizeArg(arg) {
            try {
              if (typeof arg === 'string') {
                return arg.replace(/<anonymous>/g, 'anonymous');
              }
              if (arg && typeof arg === 'object') {
                var stack = arg.stack && typeof arg.stack === 'string' ? arg.stack.replace(/<anonymous>/g, 'anonymous') : '';
                if (stack) {
                  var name = arg.name || 'Error';
                  var msg = arg.message || '';
                  return name + ': ' + msg + (stack ? '\\n' + stack : '');
                }
              }
            } catch (e) {}
            return arg;
          }
          console.error = function () {
            var args = Array.prototype.map.call(arguments, sanitizeArg);
            return origError.apply(console, args);
          };
          console.warn = function () {
            var args = Array.prototype.map.call(arguments, sanitizeArg);
            return origWarn.apply(console, args);
          };
          window.addEventListener('error', function (e) {
            if (e && e.error && typeof e.error.stack === 'string') {
              try { e.error.stack = e.error.stack.replace(/<anonymous>/g, 'anonymous'); } catch (_e) {}
            }
          });
          window.addEventListener('unhandledrejection', function (e) {
            var r = e && e.reason;
            if (r && typeof r.stack === 'string') {
              try { r.stack = r.stack.replace(/<anonymous>/g, 'anonymous'); } catch (_e) {}
            }
          });
        } catch (_e) {}

        // 2) Intercept symbolication POST → scrub stack frames' file "<anonymous>"
        try {
          var origFetch = window.fetch;
          window.fetch = async function(input, init) {
            try {
              var url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
              if (url && url.indexOf('/symbolicate') !== -1 && init && typeof init.body === 'string') {
                try {
                  var payload = JSON.parse(init.body);
                  if (payload && Array.isArray(payload.stack)) {
                    payload.stack = payload.stack.map(function (f) {
                      if (f && typeof f.file === 'string' && f.file.indexOf('<anonymous>') !== -1) {
                        return Object.assign({}, f, { file: f.file.replace(/<anonymous>/g, 'anonymous') });
                      }
                      return f;
                    });
                    var newInit = Object.assign({}, init, { body: JSON.stringify(payload) });
                    return origFetch(input, newInit);
                  }
                } catch (_e) {
                  // fall through to original fetch
                }
              }
            } catch (_outer) {}
            return origFetch(input, init);
          };
        } catch (_e2) {}
      })();
    </script>

  </body>
