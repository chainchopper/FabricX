    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overscroll-behavior: none;
      }
      body { overflow: hidden; }
      canvas { touch-action: none; }
    </style>

    <script>
      (function () {
        // Replace "<anonymous>" in strings and error stacks
        function scrubAnonymous(input) {
          try {
            if (typeof input === 'string') return input.replace(/<anonymous>/g, 'anonymous');
            if (input && typeof input === 'object') {
              if (typeof input.stack === 'string') {
                input.stack = input.stack.replace(/<anonymous>/g, 'anonymous');
              }
              if (typeof input.file === 'string') {
                input.file = input.file.replace(/<anonymous>/g, 'anonymous');
              }
            }
          } catch (_) {}
          return input;
        }

        // 1) Console guard: sanitize args before Metro picks them up
        try {
          var origError = console.error, origWarn = console.warn;
          console.error = function () {
            var args = Array.prototype.map.call(arguments, function (a) {
              if (a instanceof Error) {
                var msg = (a.name || 'Error') + ': ' + (a.message || '');
                var stack = (a.stack || '').replace(/<anonymous>/g, 'anonymous');
                return stack ? (msg + '\\n' + stack) : msg;
              }
              return scrubAnonymous(a);
            });
            return origError.apply(console, args);
          };
          console.warn = function () {
            var args = Array.prototype.map.call(arguments, scrubAnonymous);
            return origWarn.apply(console, args);
          };
          window.addEventListener('error', function (e) {
            if (e && e.error) scrubAnonymous(e.error);
          });
          window.addEventListener('unhandledrejection', function (e) {
            if (e && e.reason) scrubAnonymous(e.reason);
          });
        } catch (_) {}

        // 2) Fetch interceptor: scrub /symbolicate payload
        try {
          var origFetch = window.fetch;
          window.fetch = async function(input, init) {
            try {
              var url = (typeof input === 'string') ? input : (input && input.url ? input.url : '');
              if (url && url.indexOf('/symbolicate') !== -1 && init && typeof init.body === 'string') {
                try {
                  var payload = JSON.parse(init.body);
                  if (payload && Array.isArray(payload.stack)) {
                    payload.stack = payload.stack.map(function (f) {
                      if (f && typeof f.file === 'string') f.file = f.file.replace(/<anonymous>/g, 'anonymous');
                      if (f && typeof f.methodName === 'string') f.methodName = f.methodName.replace(/<anonymous>/g, 'anonymous');
                      return f;
                    });
                    var newInit = Object.assign({}, init, { body: JSON.stringify(payload) });
                    return origFetch(input, newInit);
                  }
                } catch (_) {}
              }
            } catch (_) {}
            return origFetch(input, init);
          };
        } catch (_) {}

        // 3) XHR interceptor: scrub /symbolicate payload
        try {
          var OrigXHR = window.XMLHttpRequest;
          function PatchedXHR() {
            var xhr = new OrigXHR();
            var _url = '';
            var _method = '';
            var _headers = {};
            var _send = xhr.send;

            xhr.open = function(method, url) {
              _method = method || '';
              _url = url || '';
              return OrigXHR.prototype.open.apply(xhr, arguments);
            };

            xhr.setRequestHeader = function(key, value) {
              _headers[key.toLowerCase()] = value;
              return OrigXHR.prototype.setRequestHeader.apply(xhr, arguments);
            };

            xhr.send = function(body) {
              try {
                if (_url && _url.indexOf('/symbolicate') !== -1 && typeof body === 'string') {
                  try {
                    var payload = JSON.parse(body);
                    if (payload && Array.isArray(payload.stack)) {
                      payload.stack = payload.stack.map(function (f) {
                        if (f && typeof f.file === 'string') f.file = f.file.replace(/<anonymous>/g, 'anonymous');
                        if (f && typeof f.methodName === 'string') f.methodName = f.methodName.replace(/<anonymous>/g, 'anonymous');
                        return f;
                      });
                      body = JSON.stringify(payload);
                    }
                  } catch (_) {}
                }
              } catch (_) {}
              return _send.call(xhr, body);
            };

            return xhr;
          }
          window.XMLHttpRequest = PatchedXHR;
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to run this app.</noscript>
  </body>
</html>
