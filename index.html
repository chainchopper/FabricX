<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Fabric — Multi‑Sensory Interactive Platform (Fanalogy)</title>

    <!-- Favicon -->
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Theme color (Fanalogy cyan/blue energy) -->
    <meta name="theme-color" content="#22d3ee" />

    <!-- Open Graph -->
    <meta property="og:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta property="og:description" content="Weave reality together. A game‑like, minimal‑chrome space with synchronized visuals, haptics, and audio. Powered by Nirvana." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Fabric — Multi‑Sensory Interactive Platform" />
    <meta name="twitter:description" content="Weave reality together. Game‑like canvas, synchronized cues, minimal chrome. Powered by Nirvana." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Full-viewport sizing and transparent background so Fabric stays visible -->
    <style>
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overscroll-behavior: none;
      }
      /* Make sure nothing adds unexpected scrollbars over the canvas */
      body { overflow: hidden; }

      /* WebGL canvas interaction friendliness */
      canvas { touch-action: none; }
    </style>

    <!-- Early sanitizer: prevent Metro from opening a literal "<anonymous>" path via symbolication -->
    <script>
      (function () {
        try {
          var origError = console.error, origWarn = console.warn;
          function sanitizeArg(arg) {
            try {
              if (typeof arg === 'string') {
                return arg.replace(/<anonymous>/g, 'anonymous');
              }
              if (arg && typeof arg === 'object') {
                // Error-like object with stack
                var stack = arg.stack && typeof arg.stack === 'string' ? arg.stack.replace(/<anonymous>/g, 'anonymous') : '';
                if (stack) {
                  var name = arg.name || 'Error';
                  var msg = arg.message || '';
                  return name + ': ' + msg + (stack ? '\\n' + stack : '');
                }
              }
            } catch (e) { /* ignore */ }
            return arg;
          }
          console.error = function () {
            var args = Array.prototype.map.call(arguments, sanitizeArg);
            return origError.apply(console, args);
          };
          console.warn = function () {
            var args = Array.prototype.map.call(arguments, sanitizeArg);
            return origWarn.apply(console, args);
          };
          window.addEventListener('error', function (e) {
            if (e && e.error && typeof e.error.stack === 'string') {
              try { e.error.stack = e.error.stack.replace(/<anonymous>/g, 'anonymous'); } catch (_e) {}
            }
          });
          window.addEventListener('unhandledrejection', function (e) {
            var r = e && e.reason;
            if (r && typeof r.stack === 'string') {
              try { r.stack = r.stack.replace(/<anonymous>/g, 'anonymous'); } catch (_e) {}
            }
          });
        } catch (_e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Enable JavaScript to run this app.</noscript>
  </body>
</html>
